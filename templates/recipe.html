{% include "base.html" %}


{{request.user}}

<div class="container mt-5">
  
    <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h2>Add Recipe</h2>
        <hr>
        <div class="mb-3">
          <label class="form-label">Recipe Name</label>
          <input type="text" class="form-control" name="recipe_name" required>
        </div>
        <div class="mb-3">
          <label  class="form-label">Recipe Description</label>
          <textarea class="form-control" required name="recipe_description"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Recipe Image</label>
          <input type="file" class="form-control" name="recipe_image">
        </div>
        <button type="submit" class="btn btn-success">Add Recipe</button>
      </form>
      
      <div class="mt-5">
        <div class="mx-auto col-6">
          <form>
          <div class="mb-3">
            <label class="form-label">Search Recipe</label>
            <input type="text" class="form-control" name="search" style="border: 1px solid;">
          </div>
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
        </div>
      </div>



    <table class="table table-bordered mt-5" style="border: 1px;">
      <thead>
        <tr>
          <th scope="col">Serial</th>
          <th scope="col">Recipe Name</th>
          <th scope="col">Recipe Description</th>
          <th scope="col">Recipe Image</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        {% for recipe in recipes %}
        <tr>
          <th scope="row">{{forloop.counter}}</th>
          <td>{{recipe.recipe_name}}</td>
          <td>{{recipe.recipe_description}}</td>
          <td>
            <img src="/media/{{recipe.recipe_image}}" style="height: 100px;">
            </td>
            <td>
              <a href="/delete_recipe/{{recipe.id}}" class="btn btn-danger m-2">Delete</a>
              <a href="/update_recipe/{{recipe.id}}" class="btn btn-success">Update</a>
            </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

</div>
